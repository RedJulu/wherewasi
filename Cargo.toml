[package]
name = "wherewasi"
version = "1.0.1"
edition = "2024"
description = "A simple CLI tool to remember what you were doing while you were away."
license = "MIT"
repository = "https://github.com/RedJulu/wherewasi"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
colored = "3.1.1"
comfy-table = "8.0.1"
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"]}
serde_json = "1.0.151"
